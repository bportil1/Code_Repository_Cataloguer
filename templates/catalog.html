<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__PROJECT_NAME__ Codebase Catalog</title>
  <style>/*__CATALOG_CSS__*/</style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1 id="project-name">Codebase Catalog</h1>
      <p id="project-root"></p>
    </div>
    <label class="search-label">
      <span>Search catalog</span>
      <input id="search" type="search" placeholder="File, class, function, import…">
    </label>
  </header>

  <section id="summary" class="summary" aria-label="Catalog summary"></section>

  <nav class="tabs" aria-label="Catalog views">
    <button class="tab active" data-view="repository">Repository</button>
    <button class="tab" data-view="definitions">Definitions</button>
    <button class="tab" data-view="dependencies">Dependencies</button>
  </nav>

  <main>
    <section id="repository-view" class="view active split-view">
      <aside class="panel tree-panel">
        <h2>Repository</h2>
        <div id="tree"></div>
      </aside>
      <section class="panel details-panel">
        <h2>Details</h2>
        <div id="details" class="empty-state">Select a file or definition.</div>
      </section>
    </section>

    <section id="definitions-view" class="view panel">
      <h2>Definitions</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Kind</th><th>File</th><th>Parent</th><th>Lines</th></tr></thead>
          <tbody id="definitions-body"></tbody>
        </table>
      </div>
    </section>

    <section id="dependencies-view" class="view dependencies-layout">
      <section class="panel">
        <h2>Internal module imports</h2>
        <div id="internal-dependencies"></div>
      </section>
      <section class="panel">
        <h2>External packages</h2>
        <div id="external-dependencies"></div>
      </section>
    </section>
  </main>

  <script>//__CATALOG_DATA__</script>
  <script>//__CATALOG_JS__</script>
</body>
</html>
